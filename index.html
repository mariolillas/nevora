<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>Nevora</title>
  <meta name="description" content="Dermatoscopía digital — lesiones y tricoscopía con la cámara del teléfono.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
  <!-- jsPDF para reportes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>
  <div id="app">
    <div class="splash cine" id="splash">
      <div class="splash-glow"></div>
      <div class="splash-particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <svg class="splash-logo" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="nv-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4f7dff"/>
            <stop offset="1" stop-color="#7c5bff"/>
          </linearGradient>
        </defs>
        <circle class="sp-wave" cx="60" cy="60" r="44"/>
        <circle class="sp-halo" cx="60" cy="60" r="54"/>
        <circle class="sp-ring" cx="60" cy="60" r="44"/>
        <circle class="sp-tick" cx="60" cy="60" r="44"/>
        <circle class="sp-dot" cx="60" cy="60" r="9"/>
      </svg>
      <h1 class="splash-name">Nevora</h1>
      <p class="splash-tag">Dermatoscopía digital</p>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
